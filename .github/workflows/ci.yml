name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be publishing the fixture's release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The fixture's release is published from main like any consumer's.
permissions:
  contents: write

jobs:
  dart:
    name: Dart package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.0'
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  # The fixture crate goes through the same reusable workflow consumers use.
  fixture:
    name: Fixture
    uses: ./.github/workflows/native.yml
    with:
      package-dir: fixtures/rust
      flake-dir: .
      attr-prefix: fixture-
