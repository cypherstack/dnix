name: dnix
description: Reproducible native assets with Nix. The build hook fetches the pinned prebuilt library and verifies its hash, or runs the same Nix build the release did.
version: 0.1.0
repository: https://github.com/cypherstack/dnix
issue_tracker: https://github.com/cypherstack/dnix/issues
topics: [native-assets, ffi, nix, reproducible-builds]

environment:
  sdk: ^3.13.0

dependencies:
  code_assets: ">=1.2.1 <3.0.0"
  crypto: ^3.0.7
  hooks: ^2.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
